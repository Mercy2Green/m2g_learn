      注意：当前图像只是机器人当前视野，不代表完整环境。
      你可以规划短程检查附近区域，例如相邻台面、柜边、地面、桌旁或当前房间内的近处区域。
      短程搜索必须服务于当前任务目标，不要进行无目的探索。
      在制定计划前，请系统检查以下问题：
      1. 当前任务真正要操作、移动、收纳、取出或清理的目标物是什么？
      2. 图像中是否存在除目标物之外、可能帮助完成任务的辅助物体？
      3. 这些辅助物体是否能够提升任务的效率、安全性、稳定性、可达性，或者减少往返次数？
