version: ahd_v01
templates:
  aggregate_transport_o0_target_visible_helper_absent:
    positive_prompt_template: "Realistic robot first-person image in {environment}. Show {target_description} on {surface}. Include {distractors}. Camera: {camera}. Lighting: {lighting}. Natural household scale, no staged puzzle layout."
    negative_prompt_template: "Do not show {must_exclude}. Avoid {avoid}."

  extend_reach_o0_target_under_furniture:
